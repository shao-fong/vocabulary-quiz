<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#193b5a">
  <title>國中英文單字練習</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;color:#18334b;background:#f5f1e7;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 12px;background:linear-gradient(145deg,#faf7ef,#ede3cf)}
    main{width:min(100%,680px);margin:auto;background:#fff;border-radius:24px;padding:clamp(20px,5vw,42px);box-shadow:0 16px 45px #21384c18}
    h1{text-align:center;font-size:clamp(1.35rem,4vw,1.9rem);margin:0 0 8px;color:#193b5a}h2{font-size:1.2rem;margin:24px 0 12px}
    .intro{text-align:center;color:#667784;margin:0 0 24px}
    .screen{display:none}.screen.active{display:block}.field-label{display:block;font-weight:700;margin:18px 0 7px}input,select{font:inherit;width:100%;padding:13px;border:1.5px solid #cbd6df;border-radius:12px;background:white;color:#18334b}input:focus,select:focus{outline:3px solid #7da9e355;border-color:#4f7fe7}
    button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 16px;background:#4f7fe7;color:white;font-weight:700;transition:filter .15s,transform .1s}button:hover{filter:brightness(.94)}button:active{transform:scale(.99)}button:disabled{opacity:1;cursor:default}input:disabled{opacity:1;color:inherit;-webkit-text-fill-color:currentColor}
    .primary{width:100%;margin-top:22px}.secondary{background:#eaf0f7;color:#193b5a}.options{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}.option{width:100%;min-height:54px;background:#f5f8fb;color:#21384c;border:2px solid #dce5ed;text-align:left}.option:hover{border-color:#4f7fe7;background:#edf3fc}.option.selected{border-color:#4f7fe7;background:#e8f0fd}.option.correct{background:#d9f1e4;border-color:#43a56a;color:#185a32}.option.wrong{background:#fde3e0;border-color:#de6c60;color:#862d27}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{text-align:left;background:#f1f5fa;color:#193b5a;border:2px solid transparent}.grid button.selected{border-color:#4f7fe7;background:#e8f0fd}.grid button:disabled{background:#f5f5f5;color:#a0a7ad}
    .count-row{display:flex;gap:8px;flex-wrap:wrap}.count-row button{flex:1;min-width:55px;padding:11px 6px;background:#eef2f6;color:#193b5a}.count-row button.selected{background:#4f7fe7;color:white}
    .bar{height:9px;background:#e9edf1;border-radius:9px;overflow:hidden;margin:10px 0 20px}.bar>div{height:100%;background:#4f7fe7;transition:width .2s}.question{padding:26px 16px;text-align:center;background:#fbf8f1;border:1px solid #eee4d1;border-radius:18px}.prompt{font-size:clamp(1.4rem,6vw,2.2rem);font-weight:800;overflow-wrap:anywhere}.hint{font-size:.85rem;color:#778590;margin-top:8px}.hud{display:flex;justify-content:space-between;color:#5e7180;font-size:.92rem}.feedback{margin-top:14px;padding:12px;border-radius:12px;text-align:center;font-weight:750}.feedback.correct{background:#d9f1e4;color:#185a32}.feedback.wrong{background:#fde3e0;color:#862d27}.speak-button{margin-top:12px}#answer-area input{text-align:center}.spelling-submit{margin-top:32px}.result-score{text-align:center;font-size:3rem;line-height:1.15;font-weight:850;color:#193b5a;margin:12px}.stats{display:flex;justify-content:space-around;text-align:center;gap:8px;margin:18px 0}.stats strong{display:block;font-size:1.25rem;color:#18334b}.note{color:#778590;font-size:.88rem;line-height:1.55}.error{display:none;background:#fff0ef;color:#a4352b;border-radius:10px;padding:11px 13px;margin-top:14px}.error.show{display:block}.leaderboard-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:360px}th,td{text-align:center;padding:11px 7px;border-bottom:1px solid #edf0f2}th{color:#71818d;font-size:.88rem}tr.mine{background:#fff4ce;font-weight:700}.status{text-align:center;color:#667784;padding:18px}
    @media(min-width:560px){.options{grid-template-columns:1fr 1fr}.grid{gap:14px}.grid button{padding:17px}}
  </style>
</head>
<body>
<main>
  <h1>📚 國中英文單字練習</h1>
  <p class="intro">選擇範圍與關卡，開始挑戰自己的單字力</p>

  <section id="setup" class="screen active">
    <label class="field-label" for="seat">座號</label>
    <input id="seat" type="number" inputmode="numeric" min="1" max="999" step="1" placeholder="請輸入座號" autocomplete="off">
    <h2>一、選擇範圍</h2>
    <div id="categories" class="grid"><div class="status">正在載入範圍…</div></div>
    <h2>二、選擇關卡</h2>
    <div id="modes" class="grid">
      <button data-mode="cn2en_choice">看中文選英文<small><br>四選一</small></button>
      <button data-mode="en2cn_choice">看英文選中文<small><br>四選一</small></button>
      <button data-mode="cn2en_spell">看中文拼英文<small><br>自行輸入拼字</small></button>
    </div>
    <h2>三、選擇題數</h2>
    <div id="counts" class="count-row">
      <button data-count="10">10</button><button data-count="20" class="selected">20</button><button data-count="30">30</button><button data-count="40">40</button><button data-count="50">50</button>
    </div>
    <button id="start" class="primary">開始測驗</button>
  </section>

  <section id="quiz" class="screen">
    <div class="hud"><span id="progress">第 1 題</span><span id="timer">00:00</span></div>
    <div class="bar"><div id="barfill" style="width:0"></div></div>
    <div class="question"><div id="prompt" class="prompt"></div><div id="difficulty" class="hint"></div></div>
    <div id="answer-area"></div>
    <button id="retry-score" class="primary" style="display:none">重試送出成績</button>
  </section>

  <section id="result" class="screen">
    <div class="status">測驗完成</div>
    <div id="score" class="result-score">0</div>
    <div class="stats"><div><strong id="accuracy">0%</strong>答對率</div><div><strong id="correct">0/0</strong>答對題數</div><div><strong id="time">0 秒</strong>作答時間</div></div>
    <p id="rank-note" class="note" style="text-align:center"></p>
    <h2 id="leader-title">🏆 排行榜</h2>
    <p class="note">排行榜依所選範圍和關卡分開計算，只顯示名次與成績。</p>
    <div class="leaderboard-wrap"><table><thead><tr><th>名次</th><th>積分</th><th>答對率</th><th>答對題數</th><th>秒數</th></tr></thead><tbody id="leaderboard"></tbody></table></div>
    <button id="again" class="primary">回到測驗設定</button>
  </section>
  <div id="error" class="error" role="alert"></div>
</main>
<script src="config.js"></script>
<script>
  const API_URL = (window.APP_CONFIG && window.APP_CONFIG.apiUrl) || 'https://vocabulary-app-api.yahoo-com-tw-860722.workers.dev/api';
  const MODES = {cn2en_choice:'看中文選英文',en2cn_choice:'看英文選中文',cn2en_spell:'看中文拼英文'};
  const state = {seatNo:'',category:'',mode:'',count:20,quizId:'',questions:[],answers:[],index:0,startedAt:0,timer:null,advanceTimer:null,locked:false,submitting:false};
  const $ = id => document.getElementById(id);
  function showError(message){const box=$('error');box.textContent=message;box.classList.add('show');setTimeout(()=>box.classList.remove('show'),6000)}
  function screen(id){document.querySelectorAll('.screen').forEach(node=>node.classList.remove('active'));$(id).classList.add('active');$('error').classList.remove('show')}
  async function api(action,payload={}){
    if(!API_URL) throw new Error('測驗服務尚未設定，請稍後再試。');
    let response;
    try{response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,payload})})}
    catch(_){throw new Error('目前無法連線，請檢查網路或稍後再試。')}
    const data=await response.json().catch(()=>({}));
    if(!response.ok||data.error) throw new Error(data.error||'服務暫時無法處理，請稍後再試。');
    return data;
  }
  function showCategories(items){
    const root=$('categories');root.replaceChildren();
    const order=['2500','國一單字','國二單字','國三單字'];
    order.forEach(name=>{
      const item=items.find(x=>x.name===name);if(!item)return;
      const button=document.createElement('button');button.textContent=`${name}｜${item.count} 個單字`;
      button.disabled=item.count<4;button.dataset.category=name;
      button.addEventListener('click',()=>{state.category=name;root.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b===button))});root.append(button);
    });
    const first=root.querySelector('button:not(:disabled)');if(first)first.click();
  }
  document.querySelectorAll('#modes button').forEach(button=>button.addEventListener('click',()=>{state.mode=button.dataset.mode;document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('selected',b===button))}));
  $('counts').addEventListener('click',event=>{const button=event.target.closest('button[data-count]');if(!button)return;state.count=Number(button.dataset.count);$('counts').querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b===button))});
  $('start').addEventListener('click',async()=>{
    const seat=String($('seat').value).trim();
    if(!/^\d{1,3}$/.test(seat)||Number(seat)<1){showError('請輸入有效座號（1 至 999）。');return}
    if(!state.category){showError('請先選擇有單字的範圍。');return}
    if(!state.mode){showError('請先選擇測驗關卡。');return}
    state.seatNo=seat;state.locked=true;$('start').disabled=true;$('start').textContent='題目載入中…';
    try{
      const result=await api('getQuizQuestions',{seatNo:seat,category:state.category,mode:state.mode,questionCount:state.count});
      clearTimeout(state.advanceTimer);state.quizId=result.quizId;state.questions=result.questions;state.answers=[];state.index=0;state.locked=false;state.submitting=false;screen('quiz');state.startedAt=Date.now();renderQuestion();
      clearInterval(state.timer);state.timer=setInterval(updateTimer,500);updateTimer();
    }catch(error){showError(error.message);state.locked=false}
    finally{$('start').disabled=false;$('start').textContent='開始測驗'}
  });
  function updateTimer(){const seconds=Math.floor((Date.now()-state.startedAt)/1000);$('timer').textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
  function renderQuestion(){
    const q=state.questions[state.index];$('progress').textContent=`第 ${state.index+1} / ${state.questions.length} 題`;$('barfill').style.width=`${state.index/state.questions.length*100}%`;
    $('prompt').textContent=q.prompt;$('difficulty').textContent=`單字難度：${q.difficulty}`;
    const area=$('answer-area');area.replaceChildren();$('retry-score').style.display='none';$('retry-score').disabled=false;$('retry-score').textContent='重試送出成績';state.locked=false;
    if(state.mode==='cn2en_spell'){
      const speak=document.createElement('button');speak.type='button';speak.className='secondary speak-button';speak.textContent='🔊 唸出英文';speak.addEventListener('click',()=>speakEnglish(state.index));
      const input=document.createElement('input');input.autocomplete='off';input.autocapitalize='none';input.spellcheck=false;input.placeholder='輸入英文單字';input.setAttribute('aria-label','輸入英文單字');
      const submit=document.createElement('button');submit.className='primary spelling-submit';submit.textContent='送出答案';submit.addEventListener('click',()=>saveAnswer(input.value));input.addEventListener('keydown',event=>{if(event.key==='Enter')saveAnswer(input.value)});area.append(speak,input,submit);input.focus();
    }else{
      const options=document.createElement('div');options.className='options';q.options.forEach(option=>{const button=document.createElement('button');button.className='option';button.textContent=option;button.addEventListener('click',()=>saveAnswer(option,button));options.append(button)});area.append(options);
    }
  }
  function preferredEnglishVoice(){
    const voices=window.speechSynthesis.getVoices().filter(voice=>/^en(-|_)/i.test(voice.lang));
    const preferredNames=[/Samantha/i,/Ava/i,/Allison/i,/Google US English/i,/Microsoft Aria/i,/Microsoft Jenny/i,/Alex/i];
    for(const pattern of preferredNames){const voice=voices.find(item=>pattern.test(item.name));if(voice)return voice}
    return voices.find(voice=>/^en-US/i.test(voice.lang))||voices[0]||null;
  }
  async function speakEnglish(index){if(!('speechSynthesis' in window)){showError('此瀏覽器不支援英文朗讀。');return}try{const result=await api('getPronunciation',{quizId:state.quizId,seatNo:state.seatNo,index});window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(result.word);utterance.lang='en-US';utterance.rate=.96;utterance.pitch=1;utterance.voice=preferredEnglishVoice();window.speechSynthesis.speak(utterance)}catch(error){showError(error.message)}}
  function advanceQuestion(){if(state.index<state.questions.length-1){state.index++;renderQuestion()}else{finishQuiz()}}
  async function saveAnswer(answer,chosenButton){if(state.locked)return;state.locked=true;const submitted=String(answer).trim();$('answer-area').querySelectorAll('button,input').forEach(el=>el.disabled=true);try{const result=await api('checkAnswer',{quizId:state.quizId,seatNo:state.seatNo,index:state.index,answer:submitted});state.answers[state.index]=submitted;const area=$('answer-area');if(chosenButton){area.querySelectorAll('.option').forEach(button=>{button.disabled=true;if(button.textContent===result.correctAnswer)button.classList.add('correct')});if(!result.isCorrect)chosenButton.classList.add('wrong');else chosenButton.classList.add('correct')}
      else{const feedback=document.createElement('div');feedback.className=`feedback ${result.isCorrect?'correct':'wrong'}`;feedback.textContent=result.isCorrect?'✓ 答對！':`✗ 答錯，正確答案：${result.correctAnswer}`;area.append(feedback)}
      if(chosenButton&&!result.isCorrect){const note=document.createElement('div');note.className='feedback wrong';note.textContent=`正確答案：${result.correctAnswer}`;area.append(note)}
      clearTimeout(state.advanceTimer);if(result.isCorrect)advanceQuestion();else state.advanceTimer=setTimeout(advanceQuestion,2000)
    }catch(error){showError(error.message);state.locked=false;$('answer-area').querySelectorAll('button,input').forEach(el=>el.disabled=false)}}
  $('retry-score').addEventListener('click',finishQuiz);
  async function finishQuiz(){if(state.locked===false||state.submitting)return;state.submitting=true;state.locked=true;clearInterval(state.timer);$('retry-score').disabled=true;$('retry-score').textContent='正在送出成績…';
    try{const result=await api('submitScore',{quizId:state.quizId,seatNo:state.seatNo,answers:state.answers});renderResult(result)}
    catch(error){showError(error.message);state.submitting=false;$('retry-score').disabled=false;$('retry-score').textContent='重試送出成績';$('retry-score').style.display='block'}
  }
  function renderResult(result){
    $('score').textContent=result.score;$('accuracy').textContent=`${result.accuracyPct}%`;$('correct').textContent=`${result.correct}/${result.total}`;$('time').textContent=`${result.timeSec} 秒`;
    $('rank-note').textContent='此榜單每個座號只列個人最佳成績，公開頁面不顯示姓名或座號。';
    $('leader-title').textContent=`🏆 ${state.category}｜${MODES[state.mode]} 排行榜`;
    const body=$('leaderboard');body.replaceChildren();
    if(!result.leaderboard||!result.leaderboard.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=5;td.textContent='目前還沒有排行榜紀錄';tr.append(td);body.append(tr)}
    else result.leaderboard.forEach(row=>{const tr=document.createElement('tr');if(row.isMe)tr.className='mine';[row.rank,row.score,`${row.accuracyPct}%`,`${row.correct}/${row.total}`,row.timeSec].forEach(value=>{const td=document.createElement('td');td.textContent=String(value);tr.append(td)});body.append(tr)});
    screen('result');$('retry-score').style.display='none';
  }
  $('again').addEventListener('click',()=>{clearTimeout(state.advanceTimer);screen('setup')});
  document.querySelectorAll('#modes button')[0].click();
  document.querySelector('#modes button').click();
  api('getCategories').then(showCategories).catch(error=>{const root=$('categories');root.textContent='範圍暫時無法載入。';showError(error.message)});
</script>
</body>
</html>
